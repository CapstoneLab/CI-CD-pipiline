location = /health {
  set $capstone_backend capstone-back:8000;
  proxy_pass http://$capstone_backend;
}
location = /docs {
  set $capstone_backend capstone-back:8000;
  proxy_pass http://$capstone_backend;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $cicd_forwarded_proto;
}
location = /openapi.json {
  set $capstone_backend capstone-back:8000;
  proxy_pass http://$capstone_backend;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $cicd_forwarded_proto;
}
location = /redoc {
  set $capstone_backend capstone-back:8000;
  proxy_pass http://$capstone_backend;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $cicd_forwarded_proto;
}
location ^~ /auth/ {
  set $capstone_backend capstone-back:8000;
  proxy_pass http://$capstone_backend;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $cicd_real_ip;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $cicd_forwarded_host;
  proxy_set_header X-Forwarded-Proto $cicd_forwarded_proto;
  proxy_set_header X-Forwarded-Port $cicd_forwarded_port;
}
location ^~ /api/ {
  set $capstone_backend capstone-back:8000;
  proxy_pass http://$capstone_backend;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $cicd_connection_upgrade;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $cicd_real_ip;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $cicd_forwarded_host;
  proxy_set_header X-Forwarded-Proto $cicd_forwarded_proto;
  proxy_set_header X-Forwarded-Port $cicd_forwarded_port;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}
